  main.append(crumb);
  if (cur !== 'hoy') {
    const u = m.f.replace(/(\.html)(#|$)/, '$1?demo$2');
    main.append(el('iframe', { src:u, title:m.l }));
    return;
  }
  const h = el('div', { class:'home' });
  h.append(el('h1', {}, 'Buenos días, ' + r.who), el('p', { class:'sub' }, r.cargo + ' · jueves 25 de septiembre'));
  h.append(el('div', { class:'kpis' }, r.kpi.map(([t, v, c]) => el('div', { class:'kpi ' + c }, el('small', {}, t), el('b', {}, v)))));
  h.append(el('div', { class:'h2' }, 'Para hacer hoy'));
  h.append(el('div', { class:'tasks' }, r.tasks.map(([k, ic, t, s, st, c]) => el('button', { class:'task', onclick: () => { cur = k; render(); } }, el('span', { class:'ic', 'aria-hidden':'true' }, ic), el('b', {}, t), el('span', {}, s), el('span', { class:'st ' + c }, st)))));
